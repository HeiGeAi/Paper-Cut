        font-size: 22px;

        z-index: 22;
        left: 120px;
        bottom: 80px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.13em;
        padding: 8px 11px;
        background: #fff9eb;
        visibility: hidden;
      }
      .frame-index::after {
        content: "";
        display: inline-block;
        width: 150px;
        height: 3px;
        margin: 0 0 5px 14px;
        background: var(--navy);
      }
